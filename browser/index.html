<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Diff Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.51/bundles/css/diff2html.min.css"
        integrity="sha384-iBvSlI3tNrrSIy7s6mvLg+5B2Z/QXbR4L0Pzg1nRf8zkXrz5JF316MLm2igMIpi2" crossorigin="anonymous" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.51/bundles/js/diff2html.min.js"
          integrity="sha384-ZvelNss0+pIzgOtutzNTd5k1ty3TFmOx0nGsDzK7gyTyhqnzM957JzY6lWy9qoZg" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
          integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>Diff Viewer</h1>
    <nav aria-label="Views">
      <button id="tab-diffs" class="tab is-active" type="button" data-view="turns">Diffs</button>
      <button id="tab-architecture" class="tab" type="button" data-view="architecture">Architecture</button>
    </nav>
    <span id="status" hidden></span>
  </header>
  <main id="turns"></main>
  <section id="architecture" class="view" hidden>
    <div class="architecture-toolbar">
      <div>
        <h2>Architecture</h2>
        <p id="architecture-meta"></p>
      </div>
      <button id="architecture-refresh" type="button">Refresh</button>
    </div>
    <div id="architecture-output" class="architecture-output"></div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
